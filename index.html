<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LINJAY 独立 HTML 项目入口">
  <title>LINJAY · Web Portal</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b13;
      --surface: rgba(20, 26, 43, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f4f7ff;
      --muted: #9ba8c6;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(139, 92, 246, 0.2), transparent 34rem),
        radial-gradient(circle at 85% 20%, rgba(34, 211, 238, 0.13), transparent 30rem),
        var(--bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 88px 0 64px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent-2);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2.65rem, 8vw, 5.8rem);
      line-height: 0.96;
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 620px;
      margin: 28px 0 56px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.75;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      display: flex;
      min-height: 260px;
      flex-direction: column;
      padding: 28px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: linear-gradient(145deg, rgba(31, 39, 64, 0.94), var(--surface));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .card::after {
      position: absolute;
      right: -70px;
      bottom: -100px;
      width: 230px;
      height: 230px;
      content: "";
      background: radial-gradient(circle, rgba(139, 92, 246, 0.38), transparent 68%);
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-5px);
      border-color: rgba(34, 211, 238, 0.5);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
      outline: none;
    }

    .status {
      align-self: flex-start;
      padding: 7px 11px;
      color: #baf7ff;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.22);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card h2 {
      margin: auto 0 10px;
      font-size: clamp(1.65rem, 4vw, 2.35rem);
      letter-spacing: -0.035em;
    }

    .card p {
      max-width: 34rem;
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .open {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      color: #d9faff;
      font-weight: 750;
    }

    footer {
      margin-top: 56px;
      padding-top: 24px;
      color: #66718d;
      border-top: 1px solid var(--line);
      font-size: 0.84rem;
    }

    @media (max-width: 600px) {
      main { width: min(100% - 28px, 1080px); padding-top: 56px; }
      .intro { margin-bottom: 38px; }
      .card { min-height: 235px; padding: 24px; border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LINJAY · Web Portal</p>
      <h1>Projects,<br>collected.</h1>
      <p class="intro">独立网页项目的统一入口。这里收录数据看板、工具与实验作品，每个项目使用稳定的专属地址。</p>
    </header>

    <section class="projects" aria-label="项目列表">
      <a class="card" href="./ti2026.html">
        <span class="status">Live · 2026</span>
        <h2>TI15 实时看板</h2>
        <p>DOTA2 国际邀请赛 2026 上海赛况、战队、选手与国籍数据。</p>
        <span class="open">打开看板 →</span>
      </a>
    </section>

    <footer>linjay.github.io · Static projects portal</footer>
  </main>
</body>
</html>
